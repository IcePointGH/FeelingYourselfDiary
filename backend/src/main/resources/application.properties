server.port=8080
spring.application.name=backend

# Spring Security: exclude ASYNC dispatches to prevent AuthorizationDeniedException
# on SSE streaming (SseEmitter triggers async dispatch, JWT filter skips it,
# leaving no SecurityContext -> AuthorizationFilter denies /api/**)
spring.security.filter.dispatcher-types=REQUEST,ERROR

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/emotion_diary?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
# ===== 生产部署前注意 =====TODO
# spring.jpa.hibernate.ddl-auto: 当前为 update，生产环境应改为 validate 或 none
# jwt.secret: 当前默认值为空字符串，生产环境必须配置强密钥（≥32字符）
# 连接池(HikariCP): 当前使用默认值，生产环境应根据负载调整 max-pool-size 等参数
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.session_factory.inject_statement_inspector=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration (for local development)
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# Frontend URL for OAuth callback redirects
app.frontend-base-url=${FRONTEND_BASE_URL:https://www.sevensense.art}

# QQ / WeChat website OAuth login
oauth.qq.client-id=${QQ_CLIENT_ID:}
oauth.qq.client-secret=${QQ_CLIENT_SECRET:}
oauth.qq.redirect-uri=${QQ_REDIRECT_URI:https://www.sevensense.art/api/auth/oauth/qq/callback}
oauth.wechat.client-id=${WECHAT_CLIENT_ID:}
oauth.wechat.client-secret=${WECHAT_CLIENT_SECRET:}
oauth.wechat.redirect-uri=${WECHAT_REDIRECT_URI:https://www.sevensense.art/api/auth/oauth/wechat/callback}
oauth.mock.enabled=${OAUTH_MOCK_ENABLED:false}

# Redis Configuration (Redisson)
redis.host=${REDIS_HOST:localhost}
redis.port=${REDIS_PORT:6379}
redis.password=${REDIS_PASSWORD:redis123}

# Spring Cache defaults (overridden by @Cacheable-specific configs)
spring.cache.redis.time-to-live=5m
spring.cache.redis.key-prefix=diary::

# MinIO Configuration
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket-name=avatars
# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===== DeepSeek AI Configuration =====
# Spring AI DeepSeek Starter
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY:placeholder}
spring.ai.deepseek.chat.options.model=deepseek-v4-flash
spring.ai.deepseek.chat.options.temperature=0.7
spring.ai.deepseek.chat.options.max-tokens=8192

# ===== User Memory Configuration =====
# 每 N 轮完整对话后自动触发用户画像更新
ai.memory.exchange-threshold=5
