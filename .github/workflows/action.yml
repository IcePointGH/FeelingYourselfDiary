name: Sync and Deploy main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-to-gitee:
    name: Push main to Gitee
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.GITEE_SYNC_PRIVATE_KEY }}" > ~/.ssh/gitee_sync_key
          chmod 600 ~/.ssh/gitee_sync_key
          ssh-keyscan gitee.com >> ~/.ssh/known_hosts

      - name: Push main to Gitee
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/gitee_sync_key -o IdentitiesOnly=yes
          GITEE_REPO: git@gitee.com:Quanyy6/FeelingYourselfDiary.git
        run: |
          git remote add gitee "$GITEE_REPO"
          git push gitee HEAD:main

  deploy-production:
    name: Deploy production server
    runs-on: ubuntu-latest
    needs: sync-to-gitee

    steps:
      - name: Configure server SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_PRIVATE_KEY }}" > ~/.ssh/server_deploy_key
          chmod 600 ~/.ssh/server_deploy_key
          ssh-keyscan -p "${{ secrets.SERVER_PORT || '22' }}" "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull code and restart Docker stack
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/server_deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "
            set -e
            cd /home/ubuntu/vibeCodingProject/FeelingYourselfDiary
            git pull
            docker-compose -f docker-compose.prod.yml down
            docker-compose -f docker-compose.prod.yml up -d --build
          "
