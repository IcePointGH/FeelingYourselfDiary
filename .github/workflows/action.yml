name: Sync GitHub main to Gitee

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-to-gitee:
    name: Push main to Gitee
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.GITEE_SYNC_PRIVATE_KEY }}" > ~/.ssh/gitee_sync_key
          chmod 600 ~/.ssh/gitee_sync_key
          ssh-keyscan gitee.com >> ~/.ssh/known_hosts

      - name: Push main to Gitee
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/gitee_sync_key -o IdentitiesOnly=yes
          GITEE_REPO: git@gitee.com:Quanyy6/FeelingYourselfDiary.git
        run: |
          git remote add gitee "$GITEE_REPO"
          git push gitee HEAD:main
